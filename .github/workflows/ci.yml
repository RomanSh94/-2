name: CI

# Минимальный smoke-гейт для X20.
# Ловит: краши на импорте (включая C1 в readiness_engine), синтаксис во всех
# модулях, поломку SQL-схемы. НЕ ловит логические баги (например C2 — для них
# нужны настоящие тесты). Используется как required-check перед merge в main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Без matrix — имя проверки должно оставаться ровно "smoke",
  # чтобы совпадать с required status check в защите ветки main.
  smoke:
    runs-on: ubuntu-latest

    env:
      # Заглушки, чтобы импорт прошёл дальше конструкторов Bot()/AsyncOpenAI().
      # Это НЕ настоящие секреты — просто формат-валидные значения для CI.
      # aiogram проверяет ФОРМАТ токена при создании Bot(), поэтому он
      # выглядит как настоящий, но им не является.
      BOT_TOKEN: "123456789:AABBCCDDEEFFGGHHIIJJKKLLMMNNOOPPQQRR"
      OPENAI_API_KEY: "sk-ci-dummy-not-a-real-key"
      ADMIN_PASSWORD: "ci-dummy"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (runtime + dev/test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (byte-compile all modules)
        run: python -m compileall -q .

      - name: Import smoke test (ловит краши на импорте, в т.ч. C1)
        run: |
          python -c "import bot; print('import bot: OK')"

      - name: DB schema smoke test (ловит поломку SCHEMA)
        run: |
          python -c "import asyncio, database; asyncio.run(database.init_db()); print('init_db: OK')"

      - name: "Unit tests (детерминированная логика: risk, safety, dependency)"
        run: python -m pytest -q

  # Narrow, permanent exact-head compatibility gate for the ACTUAL production
  # interpreter (3.10.12) -- separate from "smoke" (3.12) above so it never
  # affects that job's required-check name. Does not import bot.py: bot.py
  # constructs Bot()/AsyncOpenAI() at module scope, which "smoke" only gets
  # away with via dummy-secret env vars; here we only need py_compile
  # coverage for bot.py, not a live import.
  python-310-compatibility-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"

      - name: Install dependencies (runtime + dev/test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Confirm exact interpreter version
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 10, 12), sys.version_info"

      - name: Syntax check (production compatibility surface)
        run: |
          python -m py_compile \
            bot.py \
            database.py \
            therapeutic_domain.py \
            professional_turn_planner.py \
            professional_turn_response_fidelity_validator.py \
            professional_turn_response_policy_validator.py \
            professional_turn_response_acceptance.py \
            safety_validator.py

      - name: Safe import smoke (no Telegram/OpenAI clients, no secrets, no DB mutation)
        run: |
          python -c "import database, therapeutic_domain; print('safe import smoke: OK')"

      - name: Professional response boundary safe import (Fidelity/Policy/Acceptance)
        run: |
          python -c "import professional_turn_response_fidelity_validator, professional_turn_response_policy_validator, professional_turn_response_acceptance; print('professional response boundary safe import smoke: OK')"

      - name: Focused database contract tests under 3.10.12
        run: python -m pytest -q tests/test_practice_proposal_transition_contract.py

      - name: Professional response boundary tests under 3.10.12
        run: |
          python -m pytest -q \
            tests/test_professional_turn_response_fidelity_validator.py \
            tests/test_professional_turn_response_policy_validator.py \
            tests/test_professional_turn_response_acceptance.py
